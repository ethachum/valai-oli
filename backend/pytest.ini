[pytest]
# Valaioli — pytest configuration (Stage 5)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Show extra test summary for failures and errors
addopts =
    -v
    --tb=short
    --strict-markers

# Custom marks used in the test suite
markers =
    unit: Pure unit tests — no I/O, no subprocess, no network.
    integration: Tests that exercise the full HTTP stack via TestClient.
    security: URL validation and injection-prevention tests.
    updater: Tests for the manifest / updater subsystem.
    slow: Tests that do real subprocess or network I/O.
